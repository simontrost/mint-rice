[desktop]
computer-icon-visible=false
desktop-layout='false::false'
show-orphaned-desktop-icons=true
volumes-visible=false

[icon-view]
captions=['detailed_type', 'none', 'date_modified']

[preferences]
date-font-choice='auto-mono'
show-hidden-files=false

[search]
search-content-use-regex=true
search-reverse-sort=false
search-sort-column='name'

[window-state]
devices-expanded=true
geometry='1322x752+1970+50'
maximized=true
my-computer-expanded=true
sidebar-bookmark-breakpoint=5
start-with-menu-bar=false
start-with-sidebar=true
